[package]
name = "issuerelay-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
# reqwest's rustls pulls in aws-lc-rs. On Windows x86-64 without NASM installed, aws-lc-sys then
# uses its prebuilt objects instead of failing the build; the feature does nothing where NASM
# is present or on other platforms.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["prebuilt-nasm"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
keyring = "4.2.0"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
reqwest = "0.13"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
which = "8.0.6"

[dev-dependencies]
keyring-core = "1.0.0"
rmcp = { version = "3.5", features = ["server", "macros", "transport-async-rw", "schemars"] }
schemars = "1.2.2"
tempfile = "3.27.0"
# `start_paused` lets a test pass the 30 s call limit without waiting for it.
tokio = { version = "1.53.2", features = ["test-util"] }

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"
test = false
doc = false
