[package]
name = "issuerelay-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"
test = false
doc = false
