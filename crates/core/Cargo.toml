[package]
name = "issuerelay-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
# reqwest's rustls pulls in aws-lc-rs. On Windows x86-64 without NASM installed, aws-lc-sys then
# uses its prebuilt objects instead of failing the build; the feature does nothing where NASM
# is present or on other platforms.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["prebuilt-nasm"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
keyring = "4.2.0"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
reqwest = "0.13"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
url = "2.5.8"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
# The runner finds an executor's descendants that left its process group (macOS `libproc`) and
# signals them; the version is the one process-wrap already brings in.
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Only for the type of process-wrap's `CreationFlags` (`runner::creation_flags`): it must be the
# `windows` version process-wrap itself uses, or the flags are not of its type.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
# The named pipe's security descriptor and the check of which user serves the pipe
# (`ipc::pipe_security`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }
# `env::resolve` reads the system proxy from the current user's Internet Settings and the PATH
# from the machine's and the user's environment in the registry.
winreg = "0.56"

[dev-dependencies]
keyring-core = "1.0.0"
rmcp = { version = "3.5", features = ["server", "macros", "transport-async-rw", "schemars"] }
schemars = "1.2.2"
tempfile = "3.27.0"
# `start_paused` lets a test pass the 30 s call limit without waiting for it.
tokio = { version = "1.53.2", features = ["test-util"] }

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"
test = false
doc = false
