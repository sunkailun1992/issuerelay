[package]
name = "issuerelay-devhost"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
issuerelay-core = { version = "0.2.0", path = "../core" }
