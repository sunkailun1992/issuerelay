[package]
name = "issuerelay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "issuerelay_cli"
path = "src/lib.rs"

[[bin]]
name = "issuerelay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
issuerelay-core = { version = "0.2.0", path = "../core" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-async-rw"] }
tempfile = "3.27.0"
