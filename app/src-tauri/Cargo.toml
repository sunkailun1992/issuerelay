[package]
name = "issuerelay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "IssueRelay desktop tray app"

[lib]
name = "issuerelay_app"
crate-type = ["rlib"]

[[bin]]
name = "issuerelay-app"
path = "src/main.rs"

[dependencies]
issuerelay-core = { version = "0.1.0", path = "../../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
