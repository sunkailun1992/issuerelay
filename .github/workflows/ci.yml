name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A job that hangs would otherwise run for GitHub's default six hours. These limits are far above a
# run (about six minutes at most for the Rust-only runs so far, Windows being the slower job) and far
# below that. The test job gets 45 minutes because the first uncached compile of the Tauri app is
# heavy, Windows most of all; tighten it once real run times with the app are known.
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app lint
      - run: pnpm --dir app test
      # Before cargo, as AGENTS.md prescribes: a tauri build (custom-protocol) embeds app/dist.
      - run: pnpm --dir app build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  secrets:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash scripts/check-secrets.sh --strict
      # actionlint checks every workflow: expressions, job outputs and needs, reusable workflow
      # inputs, and the shell in `run:` steps through shellcheck. It is the author's container
      # image, pinned to a release and to the digest of that release's multi-architecture index
      # (the tag alone could be moved); move both when a newer release comes out.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
